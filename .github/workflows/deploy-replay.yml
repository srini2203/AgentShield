name: Deploy AgentShield replay dashboard

on:
  push:
    branches: [main]
    paths:
      - "replay/**"
      - ".github/workflows/deploy-replay.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static replay site
        uses: actions/upload-pages-artifact@v4
        with:
          path: replay
      - name: Deploy replay dashboard
        id: deployment
        uses: actions/deploy-pages@v4
